services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: claimit
      POSTGRES_USER: claimit
      POSTGRES_PASSWORD: claimit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql+psycopg2://claimit:claimit@db:5432/claimit
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
