<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClaimIt</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>ClaimIt</h1>
    <p class="muted">One shared list. Conflict-safe claims.</p>
  </header>

  <main>
    <section class="card">
      <h2>Sign in</h2>
      <label for="api-base">API base URL</label>
      <input id="api-base" value="http://127.0.0.1:8000">

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">

      <label for="display-name">Display name (register only)</label>
      <input id="display-name">

      <div class="row">
        <button id="register">Register</button>
        <button id="login">Login</button>
        <button id="logout" class="secondary">Sign out</button>
      </div>
      <p id="auth-status" class="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>List</h2>
      <label for="list-name">List name</label>
      <input id="list-name" value="Trip">
      <button id="create-list">Create list</button>

      <label for="list-id">List ID</label>
      <input id="list-id" type="number" min="1">
      <button id="load-items">Load items</button>
    </section>

    <section class="card">
      <h2>Add item</h2>
      <label for="item-name">Item name</label>
      <input id="item-name" value="Tent">

      <label for="item-total">Total</label>
      <input id="item-total" type="number" min="1" value="1">

      <button id="add-item">Add item</button>
    </section>

    <section class="card wide">
      <h2>Items</h2>
      <div id="items" class="items"></div>
      <p id="items-status" class="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
